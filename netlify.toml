[build]
  publish = "frontend/build"
  command = "cd frontend && npm run build"

# Password reset routes with query parameters
[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset-password/*"
  to = "/index.html"
  status = 200

# Handle all other client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
